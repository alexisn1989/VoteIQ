services:
  - type: cron
    name: voteiq-daily-ingest
    schedule: "0 2 * * *"   # 2am UTC daily
    command: python scripts/scheduled_ingest.py

  - type: cron
    name: voteiq-gemini-news
    schedule: "0 6 * * *"   # 6am UTC daily
    command: python ingest_news.py

  - type: cron
    name: voteiq-rss-news
    schedule: "0 7 * * *"   # 7am UTC daily
    command: python ingest_va_news.py
