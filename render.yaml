services:
  - type: web
    name: voteiq-api
    runtime: python311
    plan: standard
    buildCommand: bash build.sh
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    disks:
      - name: data
        mountPath: /data
        sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        scope: SERVICE
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /data
    health:
      path: /health
      pollIntervalSeconds: 30
    autoDeploy: true
