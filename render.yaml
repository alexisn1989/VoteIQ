services:
  - type: web
    name: voteiq-api
    runtime: python
    plan: standard
    buildCommand: bash build.sh
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5  # local polls.db is 2.2GB; 1GB blocked syncing the full dataset
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_TOKEN
        generateValue: true   # auto-generates a secret; copy to cron job below
      - key: FEC_API_KEY
        sync: false   # set in dashboard — without it FEC ingest falls back to
                      # DEMO_KEY (40 req/hr) and can never finish in 30 min
    healthCheckPath: /health
    autoDeploy: true

  # ── Weekly congress roll-call vote ingestion ────────────────────────────────
  # Render cron jobs cannot mount disks, so this calls the web service's
  # /api/admin/ingest-congress endpoint — which runs inside the container
  # that owns /var/data/polls.db.
  #
  # Required: set ADMIN_TOKEN + VOTEIQ_SERVICE_URL in this service's env vars
  # in the Render dashboard (copy ADMIN_TOKEN value from voteiq-api service).
  - type: cron
    name: voteiq-congress-weekly
    runtime: python
    plan: starter
    schedule: "0 3 * * 0"   # Every Sunday at 03:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_congress_ingest.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false   # set manually in dashboard — must match web service value
      - key: HOUSE_LIMIT
        value: "500"

  # ── Norfolk upcoming agenda scraper ────────────────────────────────────────
  # Runs Mon/Wed/Fri mornings — agendas typically posted ~3 days before meeting.
  # Calls the web service's /api/admin/ingest-norfolk-agenda endpoint so the
  # scraper runs inside the container that owns /var/data/polls.db.
  - type: cron
    name: voteiq-norfolk-agenda
    runtime: python
    plan: starter
    schedule: "0 6 * * 1,3,5"   # Mon, Wed, Fri at 06:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_norfolk_agenda.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── Virginia Beach vote history ingestion ─────────────────────────────────
  # Runs weekly Sunday nights — pulls full vote history for all 11 council
  # members from the Accela IQM2 public API (~11,500 records, ~3 min runtime).
  - type: cron
    name: voteiq-vb-votes
    runtime: python
    plan: starter
    schedule: "0 2 * * 0"   # Sunday at 02:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_vb_votes.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── Virginia Beach upcoming agenda scraper ─────────────────────────────────
  # VB City Council meets every other Tuesday; agendas posted ~1 week ahead.
  # Calls /api/admin/ingest-vb-agenda on the web service.
  - type: cron
    name: voteiq-vb-agenda
    runtime: python
    plan: starter
    schedule: "0 7 * * 1,4"   # Mon, Thu at 07:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_vb_agenda.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── Virginia election polls (Gemini news extraction) ───────────────────────
  # Was previously a local-machine scheduled task; moved to Render cron since
  # it only fired while a laptop + Claude Code happened to be running, causing
  # multi-day gaps. Calls /api/admin/ingest-polls?use_gemini=true so it runs
  # inside the container that owns /var/data/polls.db and GEMINI_API_KEY.
  - type: cron
    name: voteiq-polls-gemini
    runtime: python
    plan: starter
    schedule: "0 */6 * * *"   # Every 6 hours
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_va_polls_gemini.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── FEC PAC/industry weekly refresh ────────────────────────────────────────
  # Was previously a startup thread in main.py that re-ran a 30-minute FEC
  # crawl inside the web container on every deploy while data was stale (both
  # gunicorn workers launched it), repeatedly timing out against the FEC rate
  # limit. Calls /api/admin/ingest-fec-pacs (non-blocking) so it runs inside
  # the container that owns /var/data/polls.db and FEC_API_KEY.
  - type: cron
    name: voteiq-fec-weekly
    runtime: python
    plan: starter
    schedule: "0 4 * * 1"   # Every Monday at 04:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_fec_pacs.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── Congressional committee assignments weekly refresh ─────────────────────
  # Was previously a startup thread (7-day freshness check) that re-fetched
  # from unitedstates/congress-legislators on every deploy. Calls the existing
  # /api/admin/ingest-committees endpoint (non-blocking).
  - type: cron
    name: voteiq-committees-weekly
    runtime: python
    plan: starter
    schedule: "0 4 * * 2"   # Tuesday at 04:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_committees.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── FEC Schedule E (independent expenditures) weekly refresh ───────────────
  # Was previously a startup thread that re-ran a 30-minute FEC crawl on every
  # deploy while data was stale (7-day freshness check), on both gunicorn
  # workers. Calls the new /api/admin/ingest-fec-schedule-e endpoint.
  - type: cron
    name: voteiq-schedule-e-weekly
    runtime: python
    plan: starter
    schedule: "0 5 * * 2"   # Tuesday at 05:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_fec_schedule_e.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── Classic multi-source poll refresh (FiveThirtyEight/VoteHub/news) ───────
  # Distinct from voteiq-polls-gemini above — this is the non-Gemini source
  # set. Was a startup thread with a 23-hour freshness check; daily cadence
  # matches that window. Calls the existing /api/admin/ingest-polls endpoint.
  - type: cron
    name: voteiq-polls-classic-daily
    runtime: python
    plan: starter
    schedule: "0 9 * * *"   # Daily at 09:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_polls_classic.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── FEC 2026-cycle industry totals (one-time-per-disk seed) ─────────────────
  # Was a startup thread that skips forever once fec_industry_totals has any
  # 2026 rows — monthly cadence is a safety net in case the disk is rebuilt.
  # Calls the new /api/admin/ingest-fec-2026 endpoint.
  - type: cron
    name: voteiq-fec-2026-monthly
    runtime: python
    plan: starter
    schedule: "0 5 2 * *"   # 2nd of each month at 05:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_fec_2026.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── Federal vote-donor alignment monthly rebuild ────────────────────────────
  # Was a startup thread with a 30-day freshness check. Calls the new
  # /api/admin/ingest-federal-alignment endpoint.
  - type: cron
    name: voteiq-federal-alignment-monthly
    runtime: python
    plan: starter
    schedule: "0 5 3 * *"   # 3rd of each month at 05:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_federal_alignment.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── Congressional party-breakdown / unity stats monthly refresh ────────────
  # Was a startup thread that skips once fetched>=500 and stats>=5 rows exist
  # (populate-once shape, no time-based TTL) — monthly cadence is a safety
  # net. Calls the new /api/admin/ingest-party-breakdown endpoint.
  - type: cron
    name: voteiq-party-breakdown-monthly
    runtime: python
    plan: starter
    schedule: "0 5 4 * *"   # 4th of each month at 05:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_party_breakdown.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false

  # ── SBE local-race campaign finance monthly refresh ────────────────────────
  # Virginia SBE posts new filing windows quarterly (Jan/Apr/Jul/Oct).
  # Running on the 1st of each month at 05:00 UTC picks up new filings
  # shortly after each quarterly deadline without hammering the SBE server.
  # Calls /api/admin/ingest-sbe-local — runs inside the container with the DB.
  - type: cron
    name: voteiq-sbe-monthly
    runtime: python
    plan: starter
    schedule: "0 5 1 * *"   # 1st of each month at 05:00 UTC
    buildCommand: echo "no build"
    startCommand: python scripts/trigger_sbe_ingest.py
    envVars:
      - key: VOTEIQ_SERVICE_URL
        value: https://voteiq.io
      - key: ADMIN_TOKEN
        sync: false
