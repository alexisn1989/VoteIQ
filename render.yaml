services:
  - type: web
    name: voteiq-api
    runtime: python311
    plan: standard
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disks:
      - name: data
        mountPath: /data
        sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        scope: SERVICE
      - key: PYTHONUNBUFFERED
        value: "1"
    health:
      path: /health
      pollIntervalSeconds: 30
    autoDeploy: true
