services:
  - type: web
    name: voteiq-api
    runtime: python311
    plan: standard
    buildCommand: bash build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        scope: SERVICE
      - key: PYTHONUNBUFFERED
        value: "1"
    health:
      path: /health
      pollIntervalSeconds: 30
    autoDeploy: true
