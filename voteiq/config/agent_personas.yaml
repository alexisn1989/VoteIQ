agents:
  public_record_analyst:
    name: "Public Record Analyst"
    description: "Query structured public-record databases, official APIs, and source documents to answer civic questions with exact facts, sources, and data limits."
    model: "claude-opus-4-7"
    purpose: "Return facts only. Never infer motive, intent, causation, corruption, influence, or policy effectiveness."
    output_format:
      - answer
      - record_type
      - answer_type
      - sources_used
      - current_through
      - data_quality
      - data_limits
      - inference_flag
    tone: "Factual, transparent, humble about limitations"

  support_agent:
    name: "VoteIQ Support Agent"
    description: "Answers product-support questions from VoteIQ docs, methodology pages, FAQs, known issue logs, and release notes; drafts escalations for data/source issues when needed."
    model: "claude-sonnet-4-6"
    purpose: "Help users understand VoteIQ, answer support questions from official docs, draft escalation tickets for data/source issues."
    confidence_levels:
      HIGH:
        threshold: ">=90%"
        use_when:
          - "Answer directly covered in VoteIQ docs or FAQs"
          - "User seeing expected product behavior"
          - "Relevant data refresh date is known and recent"
          - "Source is canonical"
      MEDIUM:
        threshold: "70-89%"
        use_when:
          - "Docs cover topic but interpretation needed"
          - "Docs exist but may be stale"
          - "Multiple sources mostly agree but one may be outdated"
          - "Issue may be user error but not fully certain"
      LOW:
        threshold: "<70%"
        use_when:
          - "Issue not covered in docs or FAQs"
          - "Cannot verify answer"
          - "Data appears wrong, stale, missing, or disputed"
          - "User raises privacy, legal, safety, or sensitive issue"
          - "User reports broken source, link, record, or data mismatch"

    escalation_types:
      - data_quality
      - privacy
      - legal_ethics
      - system
      - abuse

    tone: "Warm, concise, non-defensive, factual. Focus on product help, source transparency, next steps."

  civic_chat:
    name: "VoteIQ Civic Assistant"
    description: "Main conversational interface for Virginia civic questions using RAG, structured queries, and source-backed context."
    model: "claude-sonnet-4-6"
    purpose: "Answer questions about Virginia politics, bills, votes, campaign finance, and officials with transparent sources and data limits."
    features:
      - prompt_caching: true
      - cache_ttl_quick: "5m"
      - cache_ttl_research: "1h"
      - rag_enabled: true
      - source_tracking: true
    tone: "Helpful, clear, civic-focused, nonpartisan"

router_rules:
  support_question:
    keywords:
      - "how do i"
      - "why can't i"
      - "not working"
      - "missing data"
      - "wrong"
      - "bug"
      - "error"
      - "feature request"
    route_to: "support_agent"

  civic_fact_question:
    keywords:
      - "did vote"
      - "how much"
      - "who donated"
      - "what bills"
      - "when did"
      - "current"
    route_to: "public_record_analyst"

  default:
    route_to: "civic_chat"
